<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">nexus+ — Seu próximo passo é digital</title>
<desc id="desc">Identidade da nexus+ em azul profundo e verde-lima, com órbitas representando conexões.</desc>
<defs><radialGradient id="bg"><stop stop-color="#213b62"/><stop offset="1" stop-color="#080e1c"/></radialGradient><linearGradient id="line"><stop stop-color="#8ecbf5"/><stop offset="1" stop-color="#c7f879"/></linearGradient></defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<g fill="none" stroke="url(#line)" opacity=".35" transform="translate(950 180) rotate(-24)"><ellipse rx="180" ry="105"/><ellipse rx="145" ry="155"/><ellipse rx="105" ry="185"/></g>
<circle cx="1070" cy="71" r="8" fill="#c7f879"/>
<text x="65" y="75" fill="#a9bdd8" font-family="Arial,sans-serif" font-size="14" letter-spacing="4">TECNOLOGIA + COMUNIDADE + POSSIBILIDADES</text>
<text x="60" y="186" fill="#f2f5ff" font-family="Arial,sans-serif" font-size="108" font-weight="700" letter-spacing="-7">nexus<tspan fill="#c7f879">+</tspan></text>
<text x="65" y="250" fill="#e3edfb" font-family="Arial,sans-serif" font-size="30">Seu próximo passo é digital.</text>
<text x="65" y="299" fill="#a9bdd8" font-family="Arial,sans-serif" font-size="19">Descubra seu momento. Crie sua presença. Aprenda com segurança.</text>
</svg>
